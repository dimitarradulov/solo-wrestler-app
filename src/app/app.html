<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <app-install-prompt />
  <ion-alert
    header="Curriculum updated"
    message="Freestyle Foundations now has 18 workouts planned for at least one hour each. Your previous progress, workout history and notes, and any unfinished workout were reset for this curriculum."
    [isOpen]="shouldShowCurriculumResetNotice()"
    [buttons]="['Dismiss']"
    (didDismiss)="dismissCurriculumResetNotice()"
  />
</ion-app>
